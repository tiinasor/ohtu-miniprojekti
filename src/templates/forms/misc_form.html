<div class="citation-fields" data-type="misc">

    <!-- Author -->


    <div class="field-row field-medium">
        <label for="author_misc">Author</label>
        <input type="text" id="author_misc" name="author" placeholder="Author name(s)">
    </div>




    <!-- Title -->
    <div class="field-row field-large">
        <label for="title_misc">Title</label>
        <input type="text" id="title_misc" name="title" placeholder="Title">
    </div>

    <!-- Year + Month -->
    <div class="field-inline">

        <div class="field-row field-small">
            <label for="year_misc">Year</label>
            <input
                type="text"
                id="year_misc"
                name="year"
                placeholder="YYYY"
            >
        </div>

        <div class="field-row field-small">
            <label for="month_article">Month</label>
            <select id="month_article" name="month">
                <option value=""></option>
                <option value="Jan">Jan</option>
                <option value="Feb">Feb</option>
                <option value="Mar">Mar</option>
                <option value="Apr">Apr</option>
                <option value="May">May</option>
                <option value="Jun">Jun</option>
                <option value="Jul">Jul</option>
                <option value="Aug">Aug</option>
                <option value="Sep">Sep</option>
                <option value="Oct">Oct</option>
                <option value="Nov">Nov</option>
                <option value="Dec">Dec</option>
            </select>
        </div>

    </div>

    <!-- Howpublished -->
    <div class="field-row field-large">
        <label for="howpublished_misc">How published</label>
        <input type="text" id="howpublished_misc" name="howpublished" placeholder="How it was published">
    </div>

    <!-- Note -->
    <div class="field-row field-large">
        <label for="note_misc">Note</label>
        <textarea
            id="note_misc"
            name="note"
            placeholder="Additional notes"
            rows="2"
        ></textarea>
    </div>

</div>
