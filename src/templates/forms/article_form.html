<div class="citation-fields" data-type="article">

    <!-- Title (required) -->
    <div class="field-row field-large required-field">
        <label for="title_article">Title</label>
        <div class="required-wrapper">
            <input 
                type="text" 
                id="title_article" 
                name="title" 
                placeholder="Enter article title"
                required
            >
            <span class="required-star">*</span>
        </div>
    </div>

    <!-- Author (required) -->
    <div class="field-row field-medium">
        <label for="author_article">
            Author <span class="required">*</span>
        </label>
        <input type="text" id="author_article" name="author"
               placeholder="Enter author name(s)" required>
    </div>

    <!-- Journal (required) -->
    <div class="field-row field-large">
        <label for="journal_article">
            Journal <span class="required">*</span>
        </label>
        <input type="text" id="journal_article" name="journal"
               placeholder="Enter journal name" required>
    </div>

    <!-- Year + Volume + Number -->
    <div class="field-inline">

        <!-- Year (required) -->
        <div class="field-row field-small">
            <label for="year_article">
                Year <span class="required">*</span>
            </label>
            <input type="text" id="year_article" name="year"
                   placeholder="YYYY" required>
        </div>

        <!-- Volume (required) -->
        <div class="field-row field-small">
            <label for="volume_article">
                Volume <span class="required">*</span>
            </label>
            <input type="text" id="volume_article" name="volume"
                   placeholder="Volume number" required>
        </div>

        <!-- Number (optional) -->
        <div class="field-row field-small">
            <label for="number_article">Number</label>
            <input type="text" id="number_article" name="number"
                   placeholder="Issue number (optional)">
        </div>
    </div>

    <!-- Pages + Month -->
    <div class="field-inline">

        <div class="field-row field-medium">
            <label for="pages_article">Pages</label>
            <input type="text" id="pages_article" name="pages"
                   placeholder="e.g. 101-120">
        </div>

        <div class="field-row field-small">
            <label for="month_article">Month</label>
            <input type="text" id="month_article" name="month"
                   placeholder="e.g. Jan">
        </div>
    </div>

</div>
