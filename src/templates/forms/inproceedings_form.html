<div class="citation-fields" data-type="inproceedings">
    
    <!-- Author (required) -->
    <div class="field-row field-medium">
        <label for="author_inproceedings">Author <span class="required">*</span></label>
        <input type="text" id="author_inproceedings" name="author" placeholder="Author name(s)" required>
    </div>

    <!-- Title (required) -->
    <div class="field-row field-large">
        <label for="title_inproceedings">Title <span class="required">*</span></label>
        <input type="text" id="title_inproceedings" name="title" placeholder="Paper title" required>
    </div>

    <!-- Booktitle (required) -->
    <div class="field-row field-large">
        <label for="booktitle_inproceedings">Booktitle <span class="required">*</span></label>
        <input type="text" id="booktitle_inproceedings" name="booktitle" placeholder="Conference/proceedings name" required>
    </div>

    <!-- Year (required) -->
    <div class="field-row field-small">
        <label for="year_inproceedings">Year <span class="required">*</span></label>
        <input type="text" id="year_inproceedings" name="year" placeholder="YYYY" required>
    </div>

    <!-- Editor (optional) -->
    <div class="field-row field-medium">
        <label for="editor_inproceedings">Editor</label>
        <input type="text" id="editor_inproceedings" name="editor" placeholder="Editor name(s)">
    </div>

    <!-- Volume/Number (optional) -->
    <div class="field-inline">
        <div class="field-row field-small">
            <label for="volume_inproceedings">Volume</label>
            <input type="text" id="volume_inproceedings" name="volume" placeholder="Volume number">
        </div>
        <div class="field-row field-small">
            <label for="number_inproceedings">Number</label>
            <input type="text" id="number_inproceedings" name="number" placeholder="Number">
        </div>
    </div>

    <!-- Series (optional) -->
    <div class="field-row field-medium">
        <label for="series_inproceedings">Series</label>
        <input type="text" id="series_inproceedings" name="series" placeholder="Series name">
    </div>

    <!-- Pages (optional) -->
    <div class="field-row field-medium">
        <label for="pages_inproceedings">Pages</label>
        <input type="text" id="pages_inproceedings" name="pages" placeholder="e.g. 101-120">
    </div>

    <!-- Address (optional) -->
    <div class="field-row field-medium">
        <label for="address_inproceedings">Address</label>
        <input type="text" id="address_inproceedings" name="address" placeholder="Location">
    </div>

    <!-- Month (optional) -->
    <div class="field-row field-small">
        <label for="month_inproceedings">Month</label>
        <input type="text" id="month_inproceedings" name="month" placeholder="e.g. Jan">
    </div>

    <!-- Organization (optional) -->
    <div class="field-row field-medium">
        <label for="organization_inproceedings">Organization</label>
        <input type="text" id="organization_inproceedings" name="organization" placeholder="Organizing body">
    </div>

    <!-- Publisher (optional) -->
    <div class="field-row field-medium">
        <label for="publisher_inproceedings">Publisher</label>
        <input type="text" id="publisher_inproceedings" name="publisher" placeholder="Publisher name">
    </div>

    <!-- Note (optional) -->
    <div class="field-row field-large">
        <label for="note_inproceedings">Note</label>
        <input type="text" id="note_inproceedings" name="note" placeholder="Additional notes">
    </div>

</div>
