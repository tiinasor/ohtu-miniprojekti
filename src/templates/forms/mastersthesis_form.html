<div class="citation-fields" data-type="mastersthesis">
    
    <!-- Author (required) -->
    <div class="field-row field-medium">
        <label for="author_mastersthesis">Author <span class="required">*</span></label>
        <input type="text" id="author_mastersthesis" name="author" placeholder="Author name" required>
    </div>

    <!-- Title (required) -->
    <div class="field-row field-large">
        <label for="title_mastersthesis">Title <span class="required">*</span></label>
        <input type="text" id="title_mastersthesis" name="title" placeholder="Thesis title" required>
    </div>

    <!-- School (required) -->
    <div class="field-row field-large">
        <label for="school_mastersthesis">School <span class="required">*</span></label>
        <input type="text" id="school_mastersthesis" name="school" placeholder="University/institution name" required>
    </div>

    <!-- Year (required) -->
    <div class="field-row field-small">
        <label for="year_mastersthesis">Year <span class="required">*</span></label>
        <input type="text" id="year_mastersthesis" name="year" placeholder="YYYY" required>
    </div>

    <!-- Type (optional) -->
    <div class="field-row field-medium">
        <label for="type_mastersthesis">Type</label>
        <input type="text" id="type_mastersthesis" name="type" placeholder="e.g. diploma thesis">
    </div>

    <!-- Address (optional) -->
    <div class="field-row field-medium">
        <label for="address_mastersthesis">Address</label>
        <input type="text" id="address_mastersthesis" name="address" placeholder="Location">
    </div>

    <!-- Month (optional) -->
    <div class="field-row field-small">
        <label for="month_mastersthesis">Month</label>
        <input type="text" id="month_mastersthesis" name="month" placeholder="e.g. Jan">
    </div>

    <!-- Note (optional) -->
    <div class="field-row field-large">
        <label for="note_mastersthesis">Note</label>
        <input type="text" id="note_mastersthesis" name="note" placeholder="Additional notes">
    </div>

</div>
