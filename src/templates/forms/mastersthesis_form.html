<div class="citation-fields" data-type="mastersthesis">

    <!-- Author + Year -->

    <div class="field-row field-medium required-field">
        <label for="author_mastersthesis">Author</label>
        <div class="required-wrapper">
            <input type="text" id="author_mastersthesis" name="author" placeholder="Author name" required>
            <span class="required-star">*</span>
        </div>
    </div>



    <!-- Title (full width, required) -->
    <div class="field-row field-large required-field">
        <label for="title_mastersthesis">Title</label>
        <div class="required-wrapper">
            <input type="text" id="title_mastersthesis" name="title" placeholder="Thesis title" required>
            <span class="required-star">*</span>
        </div>
    </div>

    <!-- School (full width, required) -->
    <div class="field-row field-large required-field">
        <label for="school_mastersthesis">School</label>
        <div class="required-wrapper">
            <input type="text" id="school_mastersthesis" name="school" placeholder="University / institution name"
                required>
            <span class="required-star">*</span>
        </div>
    </div>

    <!-- Type + Year + Month (reuired & optional) -->
    <div class="field-inline">
        <div class="field-row field-medium">
            <label for="type_mastersthesis">Type</label>
            <input type="text" id="type_mastersthesis" name="type" placeholder="e.g. Diploma thesis">
        </div>

        <div class="field-row field-small required-field">
            <label for="year_mastersthesis">Year</label>
            <div class="required-wrapper">
                <input
                    type="text"
                    id="year_mastersthesis"
                    name="year"
                    placeholder="YYYY"
                    required
                >
                <span class="required-star">*</span>
            </div>
        </div>

        <div class="field-row field-small">
            <label for="month_article">Month</label>
            <select id="month_article" name="month">
                <option value=""></option>
                <option value="Jan">Jan</option>
                <option value="Feb">Feb</option>
                <option value="Mar">Mar</option>
                <option value="Apr">Apr</option>
                <option value="May">May</option>
                <option value="Jun">Jun</option>
                <option value="Jul">Jul</option>
                <option value="Aug">Aug</option>
                <option value="Sep">Sep</option>
                <option value="Oct">Oct</option>
                <option value="Nov">Nov</option>
                <option value="Dec">Dec</option>
            </select>
        </div>
    </div>

    <!-- Address (full width, optional) -->
    <div class="field-row field-large">
        <label for="address_mastersthesis">Address</label>
        <input type="text" id="address_mastersthesis" name="address" placeholder="Location">
    </div>

    <!-- Note (full width, optional) -->
    <div class="field-row field-large">
        <label for="note_mastersthesis">Note</label>
        <textarea
            id="note_mastersthesis"
            name="note"
            placeholder="Additional notes"
            rows="2"
        ></textarea>
    </div>

</div>
