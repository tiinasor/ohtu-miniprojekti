<div class="citation-fields" data-type="book">

    <!-- Author -->
    <div class="field-row field-large required-field">
        <label for="author_book">Author (one required)</label>
        <div class="required-wrapper">
            <input type="text" id="author_book" name="author" placeholder="Author name(s)">
            <span class="required-star">*</span>
        </div>
    </div>

    <!-- Editor -->
    <div class="field-row field-large required-field">
        <label for="editor_book">Editor (alternative)</label>
        <div class="required-wrapper">
            <input type="text" id="editor_book" name="editor" placeholder="Editor name(s)">
            <span class="required-star">*</span>
        </div>
    </div>

    <!-- Title (required) -->
    <div class="field-row field-large required-field">
        <label for="title_book">Title</label>
        <div class="required-wrapper">
            <input type="text" id="title_book" name="title" placeholder="Book title" required>
            <span class="required-star">*</span>
        </div>
    </div>

    <!-- Publisher + Year (both required) -->
    <div class="field-inline">

        <div class="field-row field-medium required-field">
            <label for="publisher_book">Publisher</label>
            <div class="required-wrapper">
                <input type="text" id="publisher_book" name="publisher" placeholder="Publisher name" required>
                <span class="required-star">*</span>
            </div>
        </div>

        <div class="field-row field-small required-field">
            <label for="year_book">Year</label>
            <div class="required-wrapper">
                <input type="text" id="year_book" name="year" placeholder="YYYY" required>
                <span class="required-star">*</span>
            </div>
        </div>

    </div>

    <!-- Volume / Number (optional) -->
    <div class="field-inline">

        <div class="field-row field-small">
            <label for="volume_book">Volume</label>
            <input type="text" id="volume_book" name="volume" placeholder="Volume number">
        </div>

        <div class="field-row field-small">
            <label for="number_book">Number</label>
            <input type="text" id="number_book" name="number" placeholder="Number">
        </div>

    </div>

    <!-- Series + Address (optional) -->
    <div class="field-inline">

        <div class="field-row field-medium">
            <label for="series_book">Series</label>
            <input type="text" id="series_book" name="series" placeholder="Series name">
        </div>

        <div class="field-row field-medium">
            <label for="address_book">Address</label>
            <input type="text" id="address_book" name="address" placeholder="Publisher address">
        </div>

    </div>

    <!-- Edition + Month (optional) -->
    <div class="field-inline">

        <div class="field-row field-small">
            <label for="edition_book">Edition</label>
            <input type="text" id="edition_book" name="edition" placeholder="e.g. 2nd">
        </div>

        <div class="field-row field-small">
            <label for="month_book">Month</label>
            <input type="text" id="month_book" name="month" placeholder="e.g. Jan">
        </div>

    </div>

    <!-- Note (optional) -->
    <div class="field-row field-large">
        <label for="note_book">Note</label>
        <textarea
            id="note_book"
            name="note"
            placeholder="Additional notes"
            rows="2"
        ></textarea>
    </div>

</div>
