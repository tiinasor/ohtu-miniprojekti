<div class="citation-fields" data-type="book">
    <div class="field-row field-large">
        <label for="title_book">Title</label>
        <input type="text" id="title_book" name="title">
    </div>

    <div class="field-inline">
        <div class="field-row field-medium">
            <label for="author_book">Author</label>
            <input type="text" id="author_book" name="author">
        </div>
        <div class="field-row field-medium">
            <label for="editor_book">Editor</label>
            <input type="text" id="editor_book" name="editor">
        </div>
    </div>

    <div class="field-row field-large">
        <label for="publisher_book">Publisher</label>
        <input type="text" id="publisher_book" name="publisher">
    </div>

    <div class="field-inline">
        <div class="field-row field-small">
            <label for="year_book">Year</label>
            <input type="text" id="year_book" name="year">
        </div>
        <div class="field-row field-small">
            <label for="volume_book">Volume</label>
            <input type="text" id="volume_book" name="volume">
        </div>
        <div class="field-row field-small">
            <label for="number_book">Number</label>
            <input type="text" id="number_book" name="number">
        </div>
    </div>

    <div class="field-inline">
        <div class="field-row field-medium">
            <label for="series_book">Series</label>
            <input type="text" id="series_book" name="series">
        </div>
        <div class="field-row field-medium">
            <label for="address_book">Address</label>
            <input type="text" id="address_book" name="address">
        </div>
    </div>

    <div class="field-inline">
        <div class="field-row field-small">
            <label for="edition_book">Edition</label>
            <input type="text" id="edition_book" name="edition">
        </div>
        <div class="field-row field-small">
            <label for="month_book">Month</label>
            <input type="text" id="month_book" name="month">
        </div>
    </div>
</div>
